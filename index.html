<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Requirement a: Page Title -->
    <title>7 Sister States of India</title>
    
    <style>
        /* Requirement b: Background color set to Blue */
        body {
            background-color: #004488; /* A pleasant shade of blue */
            color: white;
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        /* Requirement c & d: Orange Heading with Underline */
        h1 {
            color: orange;
            text-decoration: underline;
            text-align: center;
        }

        /* Formatting the image */
        .main-img {
            display: block;
            margin: 20px auto;
            max-width: 80%;
            border: 3px solid orange;
            border-radius: 8px;
        }

        /* Styling the ordered list and links */
        ol {
            font-size: 1.2rem;
            line-height: 2;
            max-width: 500px;
            margin: 0 auto;
        }

        a {
            color: #ffeb3b; /* Yellow color for easy reading on blue background */
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
            color: orange;
        }
    </style>
</head>
<body>

    <!-- Heading -->
    <h1>7 Sister States of India</h1>

    <!-- Requirement e: Suitable Image of North-East India -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Northeast_India_location_map.svg/800px-Northeast_India_location_map.svg.png" 
         alt="Map of North East India" 
         class="main-img">

    <p style="text-align: center; font-size: 1.1rem;">
        Click on any state below to view detailed information and images on external pages:
    </p>

    <!-- Requirement f, g, h, i: Ordered List with Hyperlinks to external pages -->
    <ol>
        <li><a href="https://en.wikipedia.org/wiki/Arunachal_Pradesh" target="_blank">Arunachal Pradesh</a></li>
        <li><a href="https://en.wikipedia.org/wiki/Assam" target="_blank">Assam</a></li>
        <li><a href="https://en.wikipedia.org/wiki/Manipur" target="_blank">Manipur</a></li>
        <li><a href="https://en.wikipedia.org/wiki/Meghalaya" target="_blank">Meghalaya</a></li>
        <li><a href="https://en.wikipedia.org/wiki/Mizoram" target="_blank">Mizoram</a></li>
        <li><a href="https://en.wikipedia.org/wiki/Nagaland" target="_blank">Nagaland</a></li>
        <li><a href="https://en.wikipedia.org/wiki/Tripura" target="_blank">Tripura</a></li>
    </ol>

</body>
</html>
